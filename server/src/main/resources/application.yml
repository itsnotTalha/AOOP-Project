spring:
  application:
    name: verivault

  datasource:
    url: jdbc:sqlite:./database/verivault.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: CHANGE_ME_TO_A_LONG_RANDOM_SECRET
  expiration: 86400000
