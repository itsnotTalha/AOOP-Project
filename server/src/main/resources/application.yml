spring:
  application:
    name: authvault

  servlet:
    multipart:
      max-file-size: ${AUTHVAULT_UPLOAD_DOCUMENT_MAX_SIZE:50MB}
      max-request-size: ${AUTHVAULT_UPLOAD_MAX_REQUEST_SIZE:51MB}

  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:authvault.db

    hikari:
      maximum-pool-size: 1

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: CHANGE_ME_TO_A_LONG_RANDOM_SECRET
  expiration: 86400000

authvault:
  upload:
    image-max-size: ${AUTHVAULT_UPLOAD_IMAGE_MAX_SIZE:25MB}
    document-max-size: ${AUTHVAULT_UPLOAD_DOCUMENT_MAX_SIZE:50MB}
    root-directory: ${AUTHVAULT_UPLOAD_ROOT:uploads}
  verification:
    phash:
      enabled: ${AUTHVAULT_PHASH_ENABLED:true}
      # Heuristic retrieval bands; calibrate against representative AuthVault images.
      review-threshold: ${AUTHVAULT_PHASH_REVIEW_THRESHOLD:6}
      possible-match-threshold: ${AUTHVAULT_PHASH_POSSIBLE_MATCH_THRESHOLD:14}
      max-candidates: ${AUTHVAULT_PHASH_MAX_CANDIDATES:5}
      registry-scan-limit: ${AUTHVAULT_PHASH_REGISTRY_SCAN_LIMIT:100}
  image-comparison:
    enabled: ${AUTHVAULT_IMAGE_COMPARISON_ENABLED:${AUTHVAULT_AI_SERVICE_ENABLED:false}}
    base-url: ${AUTHVAULT_IMAGE_COMPARISON_BASE_URL:${AUTHVAULT_AI_SERVICE_URL:http://localhost:8001}}
    connect-timeout: ${AUTHVAULT_IMAGE_COMPARISON_CONNECT_TIMEOUT:${AUTHVAULT_AI_CONNECT_TIMEOUT:2s}}
    read-timeout: ${AUTHVAULT_IMAGE_COMPARISON_READ_TIMEOUT:${AUTHVAULT_AI_READ_TIMEOUT:10s}}
  blockchain:
    enabled: ${AUTHVAULT_BLOCKCHAIN_ENABLED:false}
    msp-id: ${AUTHVAULT_FABRIC_MSP_ID:CreatorsOrgMSP}
    channel: ${AUTHVAULT_FABRIC_CHANNEL:vaultchain-channel}
    chaincode: ${AUTHVAULT_FABRIC_CHAINCODE:registered-original-registry}
    peer-endpoint: ${AUTHVAULT_FABRIC_PEER_ENDPOINT:localhost:7051}
    peer-host-override: ${AUTHVAULT_FABRIC_PEER_HOST_OVERRIDE:peer0.creators.vaultchain.local}
    tls-cert-path: ${AUTHVAULT_FABRIC_TLS_CERT_PATH:}
    cert-path: ${AUTHVAULT_FABRIC_CERT_PATH:}
    private-key-path: ${AUTHVAULT_FABRIC_PRIVATE_KEY_PATH:}
