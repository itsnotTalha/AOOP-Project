[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultchain-image-comparison-service"
version = "0.1.0"
description = "Internal AuthVault deterministic image-comparison service"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.13.1",
    "python-multipart==0.0.32",
    "Pillow==12.3.0",
    "numpy==2.2.6",
    "opencv-python-headless==4.12.0.88",
    "uvicorn==0.52.1",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
