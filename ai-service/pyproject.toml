[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "authvault-ai-service"
version = "0.1.0"
description = "Internal AuthVault image-forensics service skeleton"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.4",
    "python-multipart==0.0.32",
    "Pillow==12.3.0",
    "numpy==2.2.6",
    "opencv-python-headless==4.12.0.88",
    "clip @ git+https://github.com/openai/CLIP.git@d05afc436d78f1c48dc0dbf8e5980a9d471f35f6",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "uvicorn==0.52.1",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]
trufor = [
    "timm==0.5.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
