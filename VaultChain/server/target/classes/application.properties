spring.application.name=vaultchain-spring-server
server.port=${PORT:3000}
# SQLite data stays under this Spring Boot project unless DATABASE_PATH is set.
vaultchain.database-path=${DATABASE_PATH:./data/vaultchain.sqlite}
spring.sql.init.mode=never
spring.web.resources.add-mappings=false
spring.mvc.problemdetails.enabled=false
vaultchain.jwt-secret=${JWT_SECRET:vaultchain-development-secret}
vaultchain.jwt-expires-in=${JWT_EXPIRES_IN:7d}

# Existing SQLite schema is initialized before the JPA EntityManager starts.
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Match the source multipart document size limit.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
vaultchain.document-directory=${DOCUMENT_UPLOAD_DIRECTORY:./data/documents}
