spring.application.name=authvault-spring-server
server.port=${PORT:3000}
# SQLite data stays under this Spring Boot project unless DATABASE_PATH is set.
authvault.database-path=${DATABASE_PATH:./data/authvault.sqlite}
vaultchain.database-path=${authvault.database-path}
spring.sql.init.mode=never
spring.web.resources.add-mappings=false
spring.mvc.problemdetails.enabled=false
authvault.jwt-secret=${JWT_SECRET:authvault-development-secret}
vaultchain.jwt-secret=${authvault.jwt-secret}
authvault.jwt-expires-in=${JWT_EXPIRES_IN:7d}
vaultchain.jwt-expires-in=${authvault.jwt-expires-in}

# Existing SQLite schema is initialized before the JPA EntityManager starts.
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Match the source multipart document size limit.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB
authvault.document-directory=${DOCUMENT_UPLOAD_DIRECTORY:./data/documents}
vaultchain.document-directory=${authvault.document-directory}
