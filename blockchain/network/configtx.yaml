Organizations:
  - &OrdererOrg
    Name: OrdererOrgMSP
    ID: OrdererOrgMSP
    MSPDir: ../generated/organizations/ordererOrganizations/vaultchain.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererOrgMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererOrgMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererOrgMSP.admin')"
    OrdererEndpoints:
      - orderer.vaultchain.local:7050

  - &CreatorsOrg
    Name: CreatorsOrgMSP
    ID: CreatorsOrgMSP
    MSPDir: ../generated/organizations/peerOrganizations/creators.vaultchain.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('CreatorsOrgMSP.admin', 'CreatorsOrgMSP.peer', 'CreatorsOrgMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('CreatorsOrgMSP.admin', 'CreatorsOrgMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('CreatorsOrgMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('CreatorsOrgMSP.peer')"
    AnchorPeers:
      - Host: peer0.creators.vaultchain.local
        Port: 7051

  - &AuthenticatorsOrg
    Name: AuthenticatorsOrgMSP
    ID: AuthenticatorsOrgMSP
    MSPDir: ../generated/organizations/peerOrganizations/authenticators.vaultchain.local/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('AuthenticatorsOrgMSP.admin', 'AuthenticatorsOrgMSP.peer', 'AuthenticatorsOrgMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('AuthenticatorsOrgMSP.admin', 'AuthenticatorsOrgMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('AuthenticatorsOrgMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('AuthenticatorsOrgMSP.peer')"
    AnchorPeers:
      - Host: peer0.authenticators.vaultchain.local
        Port: 9051

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_0: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  Addresses:
    - orderer.vaultchain.local:7050
  EtcdRaft:
    Consenters:
      - Host: orderer.vaultchain.local
        Port: 7050
        ClientTLSCert: ../generated/organizations/ordererOrganizations/vaultchain.local/orderers/orderer.vaultchain.local/tls/server.crt
        ServerTLSCert: ../generated/organizations/ordererOrganizations/vaultchain.local/orderers/orderer.vaultchain.local/tls/server.crt
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  Capabilities:
    <<: *OrdererCapabilities

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  VaultChainOrdererGenesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrg
    Consortiums:
      VaultChainConsortium:
        Organizations:
          - *CreatorsOrg
          - *AuthenticatorsOrg

  VaultChainChannel:
    Consortium: VaultChainConsortium
    <<: *ChannelDefaults
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *CreatorsOrg
        - *AuthenticatorsOrg
