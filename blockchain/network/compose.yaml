name: vaultchain

services:
  orderer.vaultchain.local:
    container_name: orderer.vaultchain.local
    image: hyperledger/fabric-orderer:${FABRIC_IMAGE_TAG:-2.5.12}
    pull_policy: never
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=file
      - ORDERER_GENERAL_BOOTSTRAPFILE=/var/hyperledger/orderer/genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererOrgMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_OPERATIONS_LISTENADDRESS=0.0.0.0:9443
    working_dir: /root
    command: orderer
    volumes:
      - ../generated/channel-artifacts/genesis.block:/var/hyperledger/orderer/genesis.block:ro
      - ../generated/organizations/ordererOrganizations/vaultchain.local/orderers/orderer.vaultchain.local/msp:/var/hyperledger/orderer/msp:ro
      - ../generated/organizations/ordererOrganizations/vaultchain.local/orderers/orderer.vaultchain.local/tls:/var/hyperledger/orderer/tls:ro
      - orderer-data:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
      - "9443:9443"
    networks:
      - vaultchain

  couchdb.creators.vaultchain.local:
    container_name: couchdb.creators.vaultchain.local
    image: couchdb:${COUCHDB_IMAGE_TAG:-3.3.3}
    pull_policy: never
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "5984:5984"
    volumes:
      - creators-couchdb-data:/opt/couchdb/data
    networks:
      - vaultchain

  peer0.creators.vaultchain.local:
    container_name: peer0.creators.vaultchain.local
    image: hyperledger/fabric-peer:${FABRIC_IMAGE_TAG:-2.5.12}
    pull_policy: never
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.creators.vaultchain.local
      - CORE_PEER_ADDRESS=peer0.creators.vaultchain.local:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.creators.vaultchain.local:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.creators.vaultchain.local:7051
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.creators.vaultchain.local:7051
      - CORE_PEER_LOCALMSPID=CreatorsOrgMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.creators.vaultchain.local:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_LEDGER_HISTORY_ENABLEHISTORYDATABASE=true
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=vaultchain
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9444
    working_dir: /root
    command: peer node start
    depends_on:
      - couchdb.creators.vaultchain.local
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../generated/organizations/peerOrganizations/creators.vaultchain.local/peers/peer0.creators.vaultchain.local/msp:/etc/hyperledger/fabric/msp:ro
      - ../generated/organizations/peerOrganizations/creators.vaultchain.local/peers/peer0.creators.vaultchain.local/tls:/etc/hyperledger/fabric/tls:ro
      - creators-peer-data:/var/hyperledger/production
    ports:
      - "7051:7051"
      - "9444:9444"
    networks:
      - vaultchain

  couchdb.authenticators.vaultchain.local:
    container_name: couchdb.authenticators.vaultchain.local
    image: couchdb:${COUCHDB_IMAGE_TAG:-3.3.3}
    pull_policy: never
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "7984:5984"
    volumes:
      - authenticators-couchdb-data:/opt/couchdb/data
    networks:
      - vaultchain

  peer0.authenticators.vaultchain.local:
    container_name: peer0.authenticators.vaultchain.local
    image: hyperledger/fabric-peer:${FABRIC_IMAGE_TAG:-2.5.12}
    pull_policy: never
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.authenticators.vaultchain.local
      - CORE_PEER_ADDRESS=peer0.authenticators.vaultchain.local:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.authenticators.vaultchain.local:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.authenticators.vaultchain.local:9051
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.authenticators.vaultchain.local:9051
      - CORE_PEER_LOCALMSPID=AuthenticatorsOrgMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb.authenticators.vaultchain.local:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_LEDGER_HISTORY_ENABLEHISTORYDATABASE=true
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=vaultchain
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9445
    working_dir: /root
    command: peer node start
    depends_on:
      - couchdb.authenticators.vaultchain.local
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ../generated/organizations/peerOrganizations/authenticators.vaultchain.local/peers/peer0.authenticators.vaultchain.local/msp:/etc/hyperledger/fabric/msp:ro
      - ../generated/organizations/peerOrganizations/authenticators.vaultchain.local/peers/peer0.authenticators.vaultchain.local/tls:/etc/hyperledger/fabric/tls:ro
      - authenticators-peer-data:/var/hyperledger/production
    ports:
      - "9051:9051"
      - "9445:9445"
    networks:
      - vaultchain

networks:
  vaultchain:
    name: vaultchain

volumes:
  orderer-data:
  creators-peer-data:
  authenticators-peer-data:
  creators-couchdb-data:
  authenticators-couchdb-data:
